name: CI

# Offline checks on every pull request to main, including pull requests from forks. Nothing here
# uses a secret and nothing calls a live API or a model: the M3 suite replays recorded cassettes.
# (The live-API and real-agent lanes are in nightly.yml.)
#
# The M3 job ends with the benchmark gate: benchmark scores must not go down. A pull request is
# compared with the baseline on main, not with its own copy of benchmarks/baseline.json. A
# maintainer can allow an intentional drop by labelling the pull request benchmark-change-approved,
# which is why the `labeled` and `unlabeled` types are listed: adding the label re-runs the check.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and generated files
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.28"
      - name: Install the project
        run: uv sync --locked
      - name: Ruff check
        run: uv run --no-sync ruff check .
      - name: Ruff format
        run: uv run --no-sync ruff format --check .
      - name: ADAPTERS.md is up to date
        # Fails when an adapter or a result file changed without `make adapters-md`.
        run: |
          uv run --no-sync python scripts/gen_adapters_md.py --check || {
            echo '::error file=ADAPTERS.md::ADAPTERS.md is out of date. Run: make adapters-md, then commit the result. After a merge conflict in ADAPTERS.md, keep either side first, then run the same command.'
            exit 1
          }
      - name: Release metadata is consistent
        # pyproject.toml, server.json and the image tag must agree on one version.
        run: uv run --no-sync python scripts/check_release.py

  m3:
    name: M3 tests (offline replay)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.28"
      - name: Install the project
        run: uv sync --locked
      - name: Set up and check the matching M3 CLI
        # The CLI version must equal the installed sf-m3 SDK, so read it from the lock.
        run: |
          set -euo pipefail
          m3_version=$(uv run --locked --no-sync python -c 'from importlib.metadata import version; print(version("sf-m3"))')
          uv tool install "sf-m3-cli==${m3_version}"
          m3 setup --python .venv/bin/python
          m3 doctor --python .venv/bin/python
      - name: Run the M3 tests
        id: tests
        env:
          KEYLESS_MCP_HTTP_MODE: replay
          M3_TIMINGS: "1"
        run: |
          set -euo pipefail
          m3 ci test --python .venv/bin/python -n auto -- m3_tests -m "not live and not agent" -q
      - name: Check every adapter was tested through M3
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        run: .venv/bin/python scripts/check_feature_results.py
      - name: M3 benchmark (scores must not go down)
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        # The labels reach the script through the environment, never through the command text.
        # Only people with triage access or above can apply a label, so the pull request cannot add it.
        env:
          BENCHMARK_PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" != pull_request ]; then
            # Push to main: compare with the baseline that was just committed.
            .venv/bin/python scripts/benchmark.py
            exit 0
          fi
          # Pull request: compare with the baseline on the base branch, not the copy in this pull
          # request, so a pull request cannot lower the bar by editing the file.
          git fetch --no-tags --depth=1 origin "${GITHUB_BASE_REF}"
          if git cat-file -e FETCH_HEAD:benchmarks/baseline.json 2>/dev/null; then
            git show FETCH_HEAD:benchmarks/baseline.json > "${RUNNER_TEMP}/main-baseline.json"
            .venv/bin/python scripts/benchmark.py \
              --baseline "${RUNNER_TEMP}/main-baseline.json" --pr-baseline benchmarks/baseline.json
          else
            echo "::notice title=No baseline on ${GITHUB_BASE_REF}::${GITHUB_BASE_REF} has no benchmarks/baseline.json yet, so this pull request is compared with its own copy."
            .venv/bin/python scripts/benchmark.py
          fi
      - name: Job summary
        if: always()
        run: |
          {
            echo "### Tested with [M3](https://github.com/sineframe/m3)"
            echo
            echo "Every keyless-mcp tool is exercised through an M3 MCP client against recorded"
            echo "cassettes: no network, no API keys. Download the \`m3-reports\` artifact and open"
            echo "it with \`m3 ui\` to see each tool call."
            echo
            echo "Benchmark scores must not go down: the M3 benchmark step compares this run with"
            echo "the baseline on main (see CONTRIBUTING.md, \"CI and the M3 benchmark\")."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload M3 reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m3-reports
          path: .m3/reports/
          if-no-files-found: warn
          retention-days: 14

  docker:
    name: Container image builds and starts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: keyless-mcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test the image
        run: |
          set -euo pipefail
          docker run --rm keyless-mcp:ci --version
          docker run --rm keyless-mcp:ci --list-tools
